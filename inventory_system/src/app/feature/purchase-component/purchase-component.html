<div class="container py-4">

  <!-- FORM -->
  <div class="card shadow-sm">

    <div class="card-header bg-primary text-white">
      Purchase Entry
    </div>

    <div class="card-body">

      <div class="row g-3">

        <!-- SUPPLIER -->
        <div class="col-md-4">
          <label class="form-label">Supplier</label>

          <select
            class="form-control"
            [(ngModel)]="purchase.supplierId">

            <option value="">Select Supplier</option>

            <option
              *ngFor="let s of suppliers"
              [value]="s.id">

              {{ s.name }}

            </option>

          </select>
        </div>

        <!-- DATE -->
        <div class="col-md-4">
          <label class="form-label">Purchase Date</label>

          <input
            type="date"
            class="form-control"
            [(ngModel)]="purchase.purchaseDate">
        </div>

        <!-- INVOICE -->
        <div class="col-md-4">
          <label class="form-label">Invoice No</label>

          <input
            class="form-control"
            [(ngModel)]="purchase.invoiceNo">
        </div>

      </div>

      <!-- PRODUCT TABLE -->
      <div class="table-responsive mt-4">

        <table class="table table-bordered">

          <thead class="table-dark">
            <tr>
              <th>Product</th>
              <th width="120">Qty</th>
              <th width="150">Purchase Price</th>
              <th width="150">Total</th>
              <th width="80">Action</th>
            </tr>
          </thead>

          <tbody>

            <tr *ngFor="let item of purchase.items; let i = index">

              <!-- PRODUCT -->
              <td>
                <select
                  class="form-control"
                  [(ngModel)]="item.productId">

                  <option value="">Select Product</option>

                  <option
                    *ngFor="let p of products"
                    [value]="p.id">

                    {{ p.name }}

                  </option>

                </select>
              </td>

              <!-- QTY -->
              <td>
                <input
                  type="number"
                  class="form-control"
                  [(ngModel)]="item.qty"
                  (input)="calculateItem(item)">
              </td>

              <!-- PRICE -->
              <td>
                <input
                  type="number"
                  class="form-control"
                  [(ngModel)]="item.purchasePrice"
                  (input)="calculateItem(item)">
              </td>

              <!-- TOTAL -->
              <td>
                <input
                  class="form-control"
                  [value]="item.total"
                  readonly>
              </td>

              <!-- REMOVE -->
              <td>
                <button
                  class="btn btn-danger btn-sm"
                  (click)="removeItem(i)">

                  X

                </button>
              </td>

            </tr>

          </tbody>

        </table>

      </div>

      <!-- ADD ITEM -->
      <button
        class="btn btn-secondary"
        (click)="addItem()">

        + Add Product

      </button>

      <!-- TOTALS -->
      <div class="row mt-4">

        <div class="col-md-4 offset-md-8">

          <div class="mb-2">
            <label>Total</label>

            <input
              class="form-control"
              [value]="purchase.grandTotal"
              readonly>
          </div>

          <div class="mb-2">
            <label>Paid</label>

            <input
              type="number"
              class="form-control"
              [(ngModel)]="purchase.paidAmount"
              (input)="calculateTotal()">
          </div>

          <div>
            <label>Due</label>

            <input
              class="form-control"
              [value]="purchase.dueAmount"
              readonly>
          </div>

        </div>

      </div>

      <!-- SAVE -->
      <div class="mt-4">
        <button
          class="btn btn-success"
          (click)="savePurchase()">

          Save Purchase

        </button>
      </div>

    </div>

  </div>

</div>
