<div class="container py-4">
     <!-- 🔍 SEARCH -->
  <input
    class="form-control mb-3"
    placeholder="Search product..."
    [(ngModel)]="searchText"
    (input)="onSearch()"
  />

    <div class="card mb-4 shadow-sm">
        <div class="card-header bg-dark text-white">
            {{ isEditMode ? 'Edit Product' : 'Add Product' }}
        </div>

        <div class="card-body">

            <div class="row g-3">

                <!-- NAME -->
                <div class="col-md-4">
                    <label class="form-label">Product Name</label>
                    <input class="form-control" placeholder="Enter product name" [(ngModel)]="selectedProduct.name">
                </div>

                <!-- CODE -->
                <div class="col-md-4">
                    <label class="form-label">Product Code</label>
                    <input class="form-control" placeholder="Enter product code" [(ngModel)]="selectedProduct.code">
                </div>

                <!-- CATEGORY -->
                <div class="col-md-4">
                    <label class="form-label">Category</label>
                    <select class="form-control" [(ngModel)]="selectedProduct.categoryId">
                        <option value="">Select Category</option>
                        <option *ngFor="let c of categories" [value]="c.id">
                            {{ c.categoryName }}
                        </option>
                    </select>
                </div>

                <!-- SUPPLIER -->
                <div class="col-md-4">
                    <label class="form-label">Supplier</label>
                    <select class="form-control" [(ngModel)]="selectedProduct.supplierId">
                        <option value="">Select Supplier</option>
                        <option *ngFor="let s of suppliers" [value]="s.id">
                            {{ s.name }}
                        </option>
                    </select>
                </div>

                <!-- PURCHASE PRICE -->
                <div class="col-md-2">
                    <label class="form-label">Purchase Price</label>
                    <input type="number" class="form-control" placeholder="0"
                        [(ngModel)]="selectedProduct.purchasePrice">
                </div>

                <!-- SALE PRICE -->
                <div class="col-md-2">
                    <label class="form-label">Sale Price</label>
                    <input type="number" class="form-control" placeholder="0" [(ngModel)]="selectedProduct.salePrice">
                </div>

                <!-- STOCK -->
                <div class="col-md-2">
                    <label class="form-label">Stock Quantity</label>
                    <input type="number" class="form-control" placeholder="0" [(ngModel)]="selectedProduct.stockQty">
                </div>

                <!-- ALERT -->
                <div class="col-md-2">
                    <label class="form-label">Alert Quantity</label>
                    <input type="number" class="form-control" placeholder="0" [(ngModel)]="selectedProduct.alertQty">
                </div>

                <!-- IMAGE -->
                <div class="col-md-12">
                    <label class="form-label">Product Image</label>
                    <input type="file" class="form-control" (change)="onFileSelected($event)">
                </div>

            </div>

            <!-- IMAGE PREVIEW -->
            <div class="mt-3" *ngIf="previewImage">
                <label class="form-label">Image Preview</label>
                <br />
                <img [src]="previewImage" class="rounded border" style="width:120px;height:120px;object-fit:cover;" />
            </div>

            <!-- BUTTONS -->
            <div class="mt-3">
                <button class="btn btn-success" (click)="save()">
                    {{ isEditMode ? 'Update' : 'Save' }}
                </button>

                <button class="btn btn-secondary ms-2" (click)="reset()">
                    Reset
                </button>
            </div>

        </div>
    </div>


    <!-- 📦 PRODUCT CARDS -->
    <div class="row g-3">

        <div class="col-md-3" *ngFor="let p of filteredProducts">

            <div class="card shadow-sm h-100">

                <img [src]="p.image || 'assets/default.png'" class="card-img-top"
                    style="height:180px;object-fit:cover;">

                <div class="card-body">
                    <h6>{{ p.name }}</h6>
                    <p class="mb-1">Code: {{ p.code }}</p>
                    <p class="mb-1">Stock: {{ p.stockQty }}</p>
                    <p class="mb-1">Purchase Price: {{ p.purchasePrice }}</p>
                    <p class="text-success">Sale: {{ p.salePrice }}</p>
                </div>

                <div class="card-footer d-flex justify-content-between">
                    <button class="btn btn-sm btn-primary" (click)="edit(p)">Edit</button>
                    <button class="btn btn-sm btn-danger" (click)="delete(p.id!)">Delete</button>
                </div>

            </div>

        </div>

    </div>

</div>
