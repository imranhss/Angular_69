<div class="container mt-5">

    <div class="card p-4">

        <h2>User Registration</h2>

        <div class="mb-3">
            <label>Name</label>
            <input type="text"
                   class="form-control"
                   [(ngModel)]="user.name">
        </div>

        <div class="mb-3">
            <label>Email</label>
            <input type="email"
                   class="form-control"
                   [(ngModel)]="user.email">
        </div>

        <div class="mb-3">
            <label>Password</label>
            <input type="password"
                   class="form-control"
                   [(ngModel)]="user.password">
        </div>

        <div class="mb-3">
            <label>Phone</label>
            <input type="text"
                   class="form-control"
                   [(ngModel)]="user.phone">
        </div>

        <div class="mb-3">
            <label>User Image</label>
            <input type="file"
                   class="form-control"
                   (change)="onFileSelected($event)">
        </div>

        <div *ngIf="previewImage">

            <img [src]="previewImage"
                 width="120"
                 height="120"
                 class="rounded-circle border">

        </div>

        <button class="btn btn-primary mt-3"
                (click)="saveUser()">
            Register
        </button>

    </div>

</div>
