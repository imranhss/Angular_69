<div class="container mt-5">

    <div class="card shadow p-4">
        <h1>Admin Profile</h1>

        <div class="text-center">

            <img [src]="loggedUser.image"
                 width="150"
                 height="150"
                 class="rounded-circle border border-3">

            <h2 class="mt-3">
                {{loggedUser.name}}
            </h2>

            <p class="text-muted">
                {{loggedUser.email}}
            </p>

        </div>

        <hr>

        <div class="row mt-4">

            <div class="col-md-6">

                <h5>Name</h5>

                <p>{{loggedUser.name}}</p>

            </div>

            <div class="col-md-6">

                <h5>Email</h5>

                <p>{{loggedUser.email}}</p>

            </div>

        </div>

        <div class="row mt-3">

            <div class="col-md-6">

                <h5>Phone</h5>

                <p>{{loggedUser.phone}}</p>

            </div>

            <div class="col-md-6">

                <h5>Password</h5>

                <p>{{loggedUser.password}}</p>

            </div>

        </div>

        <div class="text-center mt-4">

            <button class="btn btn-danger"
                    (click)="logout()">
                Logout
            </button>

        </div>

    </div>

</div>
